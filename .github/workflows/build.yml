name: Build

on: [push, pull_request]

jobs:
  build-windows-arm64:
    # windows-11-arm is a native arm64 runner (real Arm hardware, not
    # emulated), so this produces a true native arm64 build rather than a
    # cross-compiled one. CLANGARM64 is the MSYS2 environment for that target.
    runs-on: windows-11-arm
    timeout-minutes: 20
    env:
      VERBOSE: 1
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
      - name: Install dependencies
        run: |
          pacman --sync --noconfirm --needed \
            make mingw-w64-clang-aarch64-toolchain mingw-w64-clang-aarch64-cmake
          pacman --sync --noconfirm --needed \
            mingw-w64-clang-aarch64-fltk mingw-w64-clang-aarch64-libjpeg-turbo \
            mingw-w64-clang-aarch64-gnutls mingw-w64-clang-aarch64-pixman \
            mingw-w64-clang-aarch64-nettle mingw-w64-clang-aarch64-gmp \
            mingw-w64-clang-aarch64-gtest
      - name: Configure
        run: |
          cmake \
            -G "MSYS Makefiles" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_NLS=ON \
            -DENABLE_H264=ON \
            -DENABLE_AUDIO=ON \
            -DENABLE_GNUTLS=ON \
            -DENABLE_NETTLE=ON \
            -DBUILD_VIEWER=ON \
            -S . -B build
      - name: Build
        working-directory: build
        run: make
      - name: Install
        working-directory: build
        env:
          MSYS2_PATH_TYPE: inherit
        run: make installer winvnc_installer
      - uses: actions/upload-artifact@v7
        with:
          name: Windows (arm64)
          path: build/release/tigervnc*.exe
      - name: Test
        continue-on-error: true
        working-directory: build
        run: ctest --test-dir tests/unit/ --output-junit test-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-arm64
          path: build/tests/unit/test-results.xml

  report-windows-arm64:
    name: Unit tests (Windows arm64)
    runs-on: ubuntu-latest
    needs: build-windows-arm64
    if: always()
    steps:
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results-windows-arm64
          name: FIXME not used, but required
          path: '*.xml'
          reporter: java-junit
